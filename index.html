<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/x-icon" href="/vibesquad.ico" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#090714" />
    <link rel="apple-touch-icon" href="/vibesquad-192.png" />
    <script>
      // U1: set data-theme before first paint (mirrors theme.ts themeFromPrefsBlob; test/ui-theme.test.mjs keeps them in sync).
      (function () {
        var p = "system", v = "fun";
        try { var b = JSON.parse(localStorage.getItem("vs.prefs.v1")); p = b["app.theme"]; v = b["app.vibe"]; } catch (e) {}
        var dark = !window.matchMedia || matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.dataset.theme = p === "dark" || p === "light" ? p : dark ? "dark" : "light";
        document.documentElement.dataset.vibe = v === "boring" ? "boring" : "fun";
      })();
    </script>
    <title>VibeSquad</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
