[package]
name = "vibesquad-desktop"
version = "0.2.3"
description = "VibeSquad Desktop App (Tauri 2)"
authors = ["VibeSquad"]
edition = "2021"
default-run = "VibeSquad"

[[bin]]
name = "VibeSquad"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "image-ico"] }
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
minisign-verify = "0.3"
semver = "1"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["ws"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "rustls-tls-webpki-roots", "stream", "json"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
webpki-roots = "0.26"
futures-util = "0.3"
url = "2"
image = { version = "0.25", default-features = false, features = ["png", "ico"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
